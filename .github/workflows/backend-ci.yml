name: Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'BE/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'BE/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskhub
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub
        # remove host port mapping to avoid collisions
        #ports:
        #  - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskhub -d taskhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Wait for Postgres to be available
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          for i in $(seq 1 30); do
            if PGPASSWORD=taskhub psql -h localhost -U taskhub -d taskhub -c '\q' 2>/dev/null; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for Postgres... (attempt $i)"
            sleep 2
          done


      - name: Build JAR
        run: mvn -B -DskipTests package
