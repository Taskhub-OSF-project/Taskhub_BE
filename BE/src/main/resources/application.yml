spring:
  application:
    name: taskhub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.wwduzspwejdyvbnjxkkz.supabase.co:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: '4'
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  wallet:
    cash-simulation-enabled: ${APP_WALLET_CASH_SIMULATION_ENABLED:false}
  bedrock:
    enabled: ${APP_BEDROCK_ENABLED:true}
    region: ${APP_BEDROCK_REGION:us-east-1}
    model-id: ${APP_BEDROCK_MODEL_ID:global.anthropic.claude-haiku-4-5-20251001-v1:0}
    temperature: ${APP_BEDROCK_TEMPERATURE:0.3}
    max-tokens: ${APP_BEDROCK_MAX_TOKENS:4096}
  ai:
    file-allowed-hosts: ${APP_AI_FILE_ALLOWED_HOSTS:}
    file-max-bytes: ${APP_AI_FILE_MAX_BYTES:5242880}
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-default-secret-change-me-min-32-chars!!}
    access-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: ${APP_JWT_ISSUER:taskhub}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://192.168.2.4:5173,http://192.168.2.4:8081,http://192.168.2.4:3000}
  admin:
    enabled: ${APP_ADMIN_ENABLED:false}
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
    full-name: ${APP_ADMIN_FULL_NAME:TaskHub Admin}
  mail:
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  rate-limit:
    login-per-minute: ${APP_RATE_LIMIT_LOGIN:10}
    forgot-password-per-hour: ${APP_RATE_LIMIT_FORGOT_PASSWORD:5}
    refresh-per-minute: ${APP_RATE_LIMIT_REFRESH:30}
    register-per-hour: ${APP_RATE_LIMIT_REGISTER:10}
    recovery-per-hour: ${APP_RATE_LIMIT_RECOVERY:10}
    ai-per-minute: ${APP_RATE_LIMIT_AI:30}
    public-ai-per-minute: ${APP_RATE_LIMIT_PUBLIC_AI:10}

springdoc:
  swagger-ui:
    persist-authorization: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:taskhub-submissions}

logging:
  level:
    AUDIT: INFO
    org.springframework.security: INFO

---
# Dev profile — H2 in-memory for local development without Docker
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:taskhub;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
  # No-op mail configuration for dev (EmailService logs to console only)
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          connectiontimeout: 1000
          timeout: 1000
          writetimeout: 1000

---
# PostgreSQL profile (default production / docker-compose)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskhub}
    username: ${DATABASE_USERNAME:taskhub}
    password: ${DATABASE_PASSWORD:taskhub}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.taskhub: INFO
    org.hibernate.SQL: WARN
