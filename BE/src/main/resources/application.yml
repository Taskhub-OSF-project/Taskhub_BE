spring:
  application:
    name: taskhub-backend
  profiles:
    # Local run: H2 in-memory (no SQL Server required). Use profile sqlserver when DB is ready.
    active: ${SPRING_PROFILES_ACTIVE:sqlserver}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-default-secret-change-me-min-32-chars!!}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    persist-authorization: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:taskhub-submissions}