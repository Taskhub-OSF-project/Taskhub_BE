spring:
  application:
    name: taskhub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskhub}
    username: ${SPRING_DATASOURCE_USERNAME:taskhub}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: '4'
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  auth:
    require-email-verification: ${APP_REQUIRE_EMAIL_VERIFICATION:false}
    require-login-email-otp: ${APP_REQUIRE_LOGIN_EMAIL_OTP:false}
    google-client-id: ${APP_GOOGLE_CLIENT_ID:}
    refresh-cookie:
      secure: ${APP_REFRESH_COOKIE_SECURE:true}
      same-site: ${APP_REFRESH_COOKIE_SAME_SITE:None}
    trusted-device-cookie:
      name: taskhub_trusted
      secure: ${APP_TRUSTED_DEVICE_COOKIE_SECURE:true}
      same-site: ${APP_TRUSTED_DEVICE_COOKIE_SAME_SITE:None}
      max-age-seconds: ${APP_TRUSTED_DEVICE_MAX_AGE_SECONDS:2592000}
  wallet:
    cash-simulation-enabled: ${APP_WALLET_CASH_SIMULATION_ENABLED:false}
  sepay:
    api-token: ${APP_SEPAY_API_TOKEN:}
    bank-code: ${APP_SEPAY_BANK_CODE:MB}
    bank-account: ${APP_SEPAY_BANK_ACCOUNT:021107082004}
    bank-name: ${APP_SEPAY_BANK_NAME:MBBank}
    account-name: ${APP_SEPAY_ACCOUNT_NAME:VO THANH KHOA}
    qr-template: ${APP_SEPAY_QR_TEMPLATE:compact}
    min-deposit-amount: ${APP_SEPAY_MIN_DEPOSIT:10000}
    max-deposit-amount: ${APP_SEPAY_MAX_DEPOSIT:50000000}
    min-withdraw-amount: ${APP_SEPAY_MIN_WITHDRAW:50000}
    max-withdraw-amount: ${APP_SEPAY_MAX_WITHDRAW:100000000}
  bedrock:
    enabled: ${APP_BEDROCK_ENABLED:true}
    region: ${APP_BEDROCK_REGION:us-east-1}
    model-id: ${APP_BEDROCK_MODEL_ID:global.anthropic.claude-haiku-4-5-20251001-v1:0}
    temperature: ${APP_BEDROCK_TEMPERATURE:0.3}
    max-tokens: ${APP_BEDROCK_MAX_TOKENS:4096}
  ai:
    file-allowed-hosts: ${APP_AI_FILE_ALLOWED_HOSTS:}
    file-max-bytes: ${APP_AI_FILE_MAX_BYTES:5242880}
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-default-secret-change-me-min-32-chars!!}
    access-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: ${APP_JWT_ISSUER:taskhub}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    enabled: ${APP_ADMIN_ENABLED:false}
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
    full-name: ${APP_ADMIN_FULL_NAME:TaskHub Admin}
  mail:
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
    delivery-enabled: ${APP_MAIL_DELIVERY_ENABLED:false}
    provider: ${APP_MAIL_PROVIDER:ses}
    from-email: ${APP_MAIL_FROM_EMAIL:}
    region: ${APP_MAIL_REGION:${AWS_REGION:ap-southeast-1}}
    resend:
      api-key: ${APP_MAIL_RESEND_API_KEY:}  
      endpoint: ${APP_MAIL_RESEND_ENDPOINT:https://api.resend.com/emails}
  rate-limit:
    login-per-minute: ${APP_RATE_LIMIT_LOGIN:10}
    forgot-password-per-hour: ${APP_RATE_LIMIT_FORGOT_PASSWORD:5}
    refresh-per-minute: ${APP_RATE_LIMIT_REFRESH:30}
    register-per-hour: ${APP_RATE_LIMIT_REGISTER:10}
    recovery-per-hour: ${APP_RATE_LIMIT_RECOVERY:10}
    ai-per-minute: ${APP_RATE_LIMIT_AI:30}
    public-ai-per-minute: ${APP_RATE_LIMIT_PUBLIC_AI:10}

springdoc:
  api-docs:
    path: /v3/api-docs

supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:taskhub-submissions}

logging:
  level:
    AUDIT: INFO
    org.springframework.security: INFO
    # Never emit request/response DTOs: they may contain passwords or access tokens.
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO

---
# Dev profile — H2 in-memory for local development without Docker
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:taskhub;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
  # No-op mail configuration for dev (EmailService logs to console only)
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          connectiontimeout: 1000
          timeout: 1000
          writetimeout: 1000

app:
  auth:
    require-email-verification: false
    require-login-email-otp: false
    refresh-cookie:
      secure: false
      same-site: Lax
    trusted-device-cookie:
      secure: false
      same-site: Lax

---
# PostgreSQL profile (default production / docker-compose)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskhub}
    username: ${DATABASE_USERNAME:taskhub}
    password: ${DATABASE_PASSWORD:taskhub}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

---
# Production profile (AWS Lambda)
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      # Flyway owns the schema in production; Hibernate must not re-validate before
      # migrations have run (avoids startup crash when a new migration adds columns).
      ddl-auto: none
    show-sql: false

logging:
  level:
    root: INFO
    com.taskhub: INFO
    org.hibernate.SQL: WARN

app:
  auth:
    require-email-verification: true
    require-login-email-otp: true

springdoc:
  api-docs:
    enabled: false
