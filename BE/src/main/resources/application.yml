spring:
  application:
    name: taskhub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-default-secret-change-me-min-32-chars!!}
    # Access token: 15 minutes (production standard)
    expiration-ms: ${APP_JWT_EXPIRATION_MS:900000}
    # Refresh token: 7 days (production standard)
    refresh-expiration-days: ${APP_REFRESH_EXPIRATION_DAYS:7}
    max-per-user: ${APP_REFRESH_MAX_PER_USER:5}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
  sms:
    enabled: ${APP_SMS_ENABLED:false}
  # Admin account auto-seeded on first startup. Set APP_ADMIN_ENABLED=false to disable.
  admin:
    enabled: ${APP_ADMIN_ENABLED:true}
    email: ${APP_ADMIN_EMAIL:admin@taskhub.com}
    password: ${APP_ADMIN_PASSWORD:Admin@TaskHub2026}
    full-name: ${APP_ADMIN_FULL_NAME:TaskHub Admin}
  cors:
    # Comma-separated list of allowed origins for production, e.g. http://localhost:5173,https://taskhub.vn
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    # Fallback pattern used when allowed-origins is empty (dev only)
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:*}

spring.mail:
  host: ${SPRING_MAIL_HOST:smtp.gmail.com}
  port: ${SPRING_MAIL_PORT:587}
  username: ${SPRING_MAIL_USERNAME:}
  password: ${SPRING_MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

springdoc:
  swagger-ui:
    persist-authorization: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:taskhub-submissions}
